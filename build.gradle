plugins {
	id 'java'
	id 'application'
	id 'org.graalvm.buildtools.native' version '0.10.2'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

sourceCompatibility = 21
targetCompatibility = 21

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

mainClassName='com.bee.Bee'

// ################## JVM flags for module system ##################
// Required for JDK 9+ to access internal java.util.regex classes via reflection
def jvmArgsForReflection = ['--add-opens', 'java.base/java.util.regex=ALL-UNNAMED']

run {
	jvmArgs = jvmArgsForReflection
}

// Apply JVM args to distribution scripts (startScripts task)
application {
	applicationDefaultJvmArgs = jvmArgsForReflection
}

version = 'git describe --tags'.execute().text.trim()
group='com.bee'

repositories {
    mavenCentral()
}

jar {
	manifest {
		attributes(
			"Main-Class": "com.bee.Bee",
			"Implementation-Title": "bee",
			"Implementation-Version": project.getVersion()
		)
	}
}

dependencies {
	implementation 'info.picocli:picocli:4.6.1'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	jvmArgs = jvmArgsForReflection
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

// ################## GraalVM Native Image Configuration ##################
graalvmNative {
	binaries {
		main {
			imageName = 'bee'
			mainClass = 'com.bee.Bee'

			buildArgs.add('--verbose')
			buildArgs.add('--no-fallback')
			buildArgs.add('-H:+ReportExceptionStackTraces')

			// Required for accessing java.util.regex internals
			buildArgs.add('--add-opens=java.base/java.util.regex=ALL-UNNAMED')
		}
	}

	metadataRepository {
		enabled = true
	}
}
