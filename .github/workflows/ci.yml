name: CI

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Build with Gradle
        run: gradle build

      - name: Run tests
        run: gradle test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk-${{ matrix.java }}
          path: build/reports/tests/
          retention-days: 7

  native-image:
    name: Build and Test Native Image (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Build Native Image
        run: gradle nativeCompile

      - name: Test Native Binary - Generate samples
        run: |
          # Generate samples from test patterns
          ./build/native/nativeCompile/bee -i test-patterns.txt -c 3 > generated-output.txt
          echo "Generated output:"
          cat generated-output.txt

      - name: Validate Native Binary Output
        run: |
          #!/bin/bash
          set -e

          # Read the generated output and validate each line matches the expected pattern
          echo "Validating generated samples match their patterns..."

          # Read test patterns (skip comments and empty lines)
          mapfile -t patterns < <(grep -v '^#' test-patterns.txt | grep -v '^$')

          # Read generated output
          mapfile -t generated < generated-output.txt

          # Track validation
          total_patterns=0
          validated=0
          failed=0

          # Process output - each pattern generates 3 samples
          line_idx=0
          for pattern in "${patterns[@]}"; do
            echo "Pattern: $pattern"
            total_patterns=$((total_patterns + 1))

            # Get the 3 samples for this pattern
            for i in {1..3}; do
              if [ $line_idx -lt ${#generated[@]} ]; then
                sample="${generated[$line_idx]}"
                line_idx=$((line_idx + 1))

                # Validate the sample matches the pattern
                if echo "$sample" | grep -qE "^${pattern}$"; then
                  echo "  ✓ Sample '$sample' matches pattern"
                  validated=$((validated + 1))
                else
                  echo "  ✗ Sample '$sample' does NOT match pattern '$pattern'"
                  failed=$((failed + 1))
                fi
              fi
            done
          done

          echo ""
          echo "================================================"
          echo "Validation Summary:"
          echo "  Total patterns tested: $total_patterns"
          echo "  Total samples validated: $validated"
          echo "  Failed validations: $failed"
          echo "================================================"

          if [ $failed -gt 0 ]; then
            echo "ERROR: Some generated samples did not match their patterns!"
            exit 1
          fi

          echo "SUCCESS: All generated samples match their patterns!"

      - name: Test Native Binary - Basic functionality
        run: |
          echo "Testing basic regex pattern generation..."
          ./build/native/nativeCompile/bee -r '[a-z]{5}' -c 5
          ./build/native/nativeCompile/bee -r '\d{3}-\d{4}' -c 3
          ./build/native/nativeCompile/bee -r 'test|sample|demo' -c 4
          echo "Basic functionality tests passed!"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: bee-native-ubuntu-24.04
          path: build/native/nativeCompile/bee
          retention-days: 7
